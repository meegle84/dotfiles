- defaults:
    link:
      create: true
      relink: true
      force: false

- link:
    ~/.zshenv: zsh/.zshenv
    ~/.zsh: zsh
    ~/.gitconfig: git/.gitconfig
    ~/.local/bin/brewup: bin/brewup
    ~/.local/bin/brewdel: bin/brewdel
    ~/.local/bin/caskup: bin/caskup
    ~/.local/bin/osxup: bin/osxup
    ~/.local/bin/list-apps: bin/list-apps
    ~/.local/bin/defaults-diff: bin/defaults-diff

- shell:
    - description: Applying macOS defaults
      command: bash scripts/macos-defaults.sh
      stdout: true
      stderr: true
